<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10251f">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="Nguyen Minh Triet">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:locale:alternate" content="{{OG_ALT_LOCALE}}">
  {{ARTICLE_META}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="en" href="{{EN_URL}}">
  <link rel="alternate" hreflang="vi" href="{{VI_URL}}">
  <link rel="alternate" hreflang="x-default" href="{{EN_URL}}">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{SITE_CSS}}">
  <title>{{TITLE}} | Nguyen Minh Triet</title>
  <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body data-page-lang="{{LANG}}" data-page-type="update-article" data-page-slug="{{SLUG}}">
  <a class="skip-link" href="#main">{{SKIP}}</a>
  {{HEADER}}
  <main id="main">
    <article class="article-shell">
      <header class="article-header wrap-narrow">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="/{{LANG}}/">{{HOME_LABEL}}</a><span aria-hidden="true">/</span>
          <a href="/{{LANG}}/updates/">{{UPDATES_LABEL}}</a><span aria-hidden="true">/</span>
          <span aria-current="page">{{BREADCRUMB_CURRENT}}</span>
        </nav>
        <p class="eyebrow">{{EYEBROW}}</p>
        <h1>{{TITLE}}</h1>
        <p class="article-deck">{{DESCRIPTION}}</p>
        <div class="article-meta">{{DATE_LABEL}}<span>{{READING_TIME}}</span></div>
      </header>
      <figure class="article-cover wrap">
        <img src="{{COVER}}" alt="{{COVER_ALT}}" width="1600" height="900" decoding="async" fetchpriority="high">
      </figure>
      <div class="article-body wrap-narrow">{{ARTICLE_BODY}}</div>
      <footer class="article-footer wrap-narrow">
        <div class="tag-list">{{TAGS}}</div>
        <a class="btn btn-primary" href="{{VENTURE_URL}}" target="_blank" rel="noopener noreferrer">{{CTA}}</a>
        <a class="text-link" href="/{{LANG}}/updates/">{{BACK_TO_UPDATES}}</a>
      </footer>
    </article>
  </main>
  {{FOOTER}}
  <script src="{{SITE_JS}}" defer></script>
</body>
</html>
