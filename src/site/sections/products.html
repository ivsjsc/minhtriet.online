<!-- PRODUCTS PORTFOLIO SECTION -->
<section class="section" id="products" aria-labelledby="products-title" data-en-vi-content>
  <div class="wrap">
    <div class="section-heading">
      <div>
        <p class="kicker" data-i18n="products_kicker">Master Product &amp; Initiative Portfolio</p>
        <h2 id="products-title" data-i18n="products_title">Danh mục Sản phẩm &amp; Dự án Tiêu biểu</h2>
      </div>
      <p class="section-intro" data-i18n="products_intro">Tổng hợp toàn bộ các sản phẩm phần mềm số, giải pháp SaaS/EdTech/AI, nền tảng tin cậy và các dự án chuyển đổi số / vận hành kinh doanh thực tế.</p>
    </div>

    <!-- Tier Navigation Tabs -->
    <div class="portfolio-tabs-container">
      <div class="portfolio-tabs" role="tablist" aria-label="Portfolio Categories">
        <button class="portfolio-tab active" type="button" role="tab" aria-selected="true" data-portfolio-tab="featured" id="tab-featured" aria-controls="panel-portfolio" data-i18n="tab_featured">
          <i class="fa-solid fa-star" aria-hidden="true"></i> Featured Tech Products
        </button>
        <button class="portfolio-tab" type="button" role="tab" aria-selected="false" data-portfolio-tab="business" id="tab-business" aria-controls="panel-portfolio" data-i18n="tab_business">
          <i class="fa-solid fa-briefcase" aria-hidden="true"></i> Business &amp; Operations
        </button>
        <button class="portfolio-tab" type="button" role="tab" aria-selected="false" data-portfolio-tab="full" id="tab-full" aria-controls="panel-portfolio" data-i18n="tab_full">
          <i class="fa-solid fa-layer-group" aria-hidden="true"></i> Ecosystem Catalog (30+)
        </button>
        <button class="portfolio-tab" type="button" role="tab" aria-selected="false" data-portfolio-tab="labs" id="tab-labs" aria-controls="panel-portfolio" data-i18n="tab_labs">
          <i class="fa-solid fa-flask" aria-hidden="true"></i> Labs &amp; R&amp;D Prototypes
        </button>
      </div>
    </div>

    <!-- Category Filter Controls (Shown primarily for Ecosystem Catalog) -->
    <div class="portfolio-category-filter hidden" id="portfolioCategoryFilter">
      <span class="filter-label" data-i18n="filter_label"><i class="fa-solid fa-filter"></i> Lọc theo nhóm:</span>
      <button class="category-btn active" type="button" data-category="all" data-i18n="cat_all">Tất cả</button>
      <button class="category-btn" type="button" data-category="EdTech & SaaS" data-i18n="cat_edtech">EdTech &amp; SaaS</button>
      <button class="category-btn" type="button" data-category="AI & Automation" data-i18n="cat_ai">AI &amp; Automation</button>
      <button class="category-btn" type="button" data-category="Trust & Commerce" data-i18n="cat_trust">Trust &amp; Commerce</button>
      <button class="category-btn" type="button" data-category="Community & Platforms" data-i18n="cat_community">Community &amp; Platforms</button>
    </div>

    <!-- Dynamic Portfolio Container Grid -->
    <div class="grid-2 portfolio-grid" id="portfolioContainer" role="tabpanel" aria-labelledby="tab-featured">
      <!-- Dynamic content rendered by JS from PROJECT_PORTFOLIO_MASTER.json -->
    </div>
  </div>
</section>
