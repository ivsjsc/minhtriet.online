name: Deploy production to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Validate generated site
        run: npm run validate

      - name: Check internal links
        run: npm run check:links

      - name: Check accessibility
        run: npm run check:a11y

      - name: Check structured data
        run: npm run check:schema

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }

      - name: Resolve Cloudflare Pages project for minhtriet.online
        id: cloudflare_project
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error --fail-with-body \
            --request GET \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json")"

          success="$(printf '%s' "$response" | jq -r '.success // false')"
          if [ "$success" != "true" ]; then
            printf '%s\n' "$response" | jq -c '{success, errors, messages}'
            exit 1
          fi

          project_name="$(printf '%s' "$response" | jq -r '
            [ .result[] | select((.domains // []) | index("minhtriet.online")) | .name ][0] // empty
          ')"

          if [ -z "$project_name" ]; then
            project_name="$(printf '%s' "$response" | jq -r '
              [ .result[] | select(.name == "minhtriet-online" or .name == "minhtriet.online") | .name ][0] // empty
            ')"
          fi

          if [ -z "$project_name" ]; then
            echo "No Cloudflare Pages project associated with minhtriet.online was found in this account."
            echo "Available Pages projects:"
            printf '%s' "$response" | jq -r '.result[].name' | sed 's/^/  - /'
            exit 1
          fi

          echo "Resolved Cloudflare Pages project: $project_name"
          echo "name=$project_name" >> "$GITHUB_OUTPUT"

      - name: Deploy public directory to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@3 pages deploy public \
            --project-name="${{ steps.cloudflare_project.outputs.name }}" \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'Manual production deployment' }}"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Cloudflare Pages deployment"
            echo "- Domain: https://minhtriet.online"
            echo "- Project: ${{ steps.cloudflare_project.outputs.name }}"
            echo "- Branch: main"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
