[build]
  command = "npm run build"
  publish = "public"

[[redirects]]
  from = "/updates"
  to = "/en/updates/"
  status = 301

[[redirects]]
  from = "/updates/"
  to = "/en/updates/"
  status = 301

[[redirects]]
  from = "/updates/:slug"
  to = "/en/updates/:slug/"
  status = 301

[[redirects]]
  from = "/updates/:slug/"
  to = "/en/updates/:slug/"
  status = 301

[[redirects]]
  from = "/"
  to = "/en"
  status = 301
  force = false

[[redirects]]
  from = "/vi"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/de"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/es"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/fr"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/ja"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/ko"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/ru"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/th"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/zh"
  to = "/index.html"
  status = 200
  force = false

# Fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/en/updates/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vi/updates/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
